<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ginhaw.AI | Self-Check</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="test.css">
</head>
<body>
  <div class="landing-page-container">
    <header class="landing-page-header">
      <div class="landing-page-whitebox">
        <div class="landing-page-content">
          <div class="landing-page-headerlogo">
            <img src="public/external/ginhawailogo1i835-598s-200h.png" alt="Ginhaw.AI Logo" class="landing-page-ginhawailogo1">
          </div>
          <div class="landing-page-rightcontent">
            <button class="link-button">About Us</button>
            <button class="landing-page-register">Register Your Facility</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="landing-page-frame32">
        <h1 class="landing-page-text21">Ginhaw.AI:</h1>
        <h2 class="landing-page-text22">Self-Check</h2>
        <p class="landing-page-text23">
          Answer a few quick questions and our AI will give you a preliminary assessment based on your symptoms and health history.
        </p>
      </section>

      <form id="selfCheckForm" class="landing-page-frame41">
        <div class="landing-page-frame37">

          <div class="form-group">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Enter your name" required>
          </div>

          <div class="form-group">
            <label>What was your sex assigned at birth?</label>
            <div class="options-box">
              <label class="option-card"><input type="radio" name="gender" value="Female" required> Female</label>
              <label class="option-card"><input type="radio" name="gender" value="Male"> Male</label>
            </div>
          </div>

          <div class="form-group">
            <label for="age">How old are you?</label>
            <input id="age" name="age" type="number" min="1" max="120" placeholder="Age" required>
          </div>

          <div class="form-group">
            <label for="symptom">What symptom is bothering you?</label>
            <input id="symptom" name="symptom" type="text" placeholder="Type a symptom..." required>
          </div>

          <div class="form-group">
            <label>Any other details we should know?</label>
            <div class="options-box">
              <label class="option-card"><input type="checkbox" name="details" value="Surgeries"> Previous surgeries</label>
              <label class="option-card"><input type="checkbox" name="details" value="Conditions"> Past conditions</label>
              <label class="option-card"><input type="checkbox" name="details" value="Lifestyle"> Lifestyle factors</label>
              <label class="option-card"><input type="checkbox" name="details" value="Reproductive"> Reproductive history</label>
              <label class="option-card"><input type="checkbox" name="details" value="Medications"> Current medications</label>
              <label class="option-card"><input type="checkbox" name="details" value="FamilyHistory"> Family history</label>
              <label class="option-card"><input type="checkbox" name="details" value="None"> None of the above</label>
            </div>
          </div>
        </div>
        <button type="submit" class="landing-page-button-variant4">Submit</button>
      </form>
    </main>

    <footer class="landing-page-footer">
      <p>© Ginhaw.AI, 2025</p>
      <p>ginhawAIdevs@gmail.com</p>
      <p>Ginhaw.AI does not provide medical diagnosis or treatment. This tool is for guidance only.</p>
    </footer>
  </div>
  <script src="self-check.js"></script>
</body>
</html>
